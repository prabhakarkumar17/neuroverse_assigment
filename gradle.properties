# JVM memory for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build only what changed, and run independent tasks in parallel.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Kotlin compiles in a separate daemon process.
kotlin.code.style=official

# AndroidX (the modern support libraries) instead of the ancient ones.
android.useAndroidX=true

# Only generate resources for the screen densities/locales we ship.
android.nonTransitiveRClass=true
